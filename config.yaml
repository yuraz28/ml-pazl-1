# Общий конфиг материалов курса.
#
# Поля урока:
#   n            — номер занятия (обязателен, это ключ)
#   title        — название; если не задано, берётся из <title> деки
#   opens        — "YYYY-MM-DD" (дата открытия) ИЛИ "soon" (дата неизвестна)
#   presentation — путь до презентации от корня (кнопка «Презентация»)
#   docs         — путь до описания в .md от корня (кнопка «Описание»; на сборке
#                  markdown превращается в страницу docs/lesson-NN.html)
#
# Правило: дата opens уже наступила → занятие открыто (как только есть дека);
# дата впереди → карточка закрыта, справа сверху — дата выхода (без отсчёта).
#
# ВАЖНО: правки этого файла подхватываются только после пересборки:
#     uv run python scripts/build_lesson_index.py
# На GitHub это делает workflow автоматически при пуше в main.

course:
  title: "Машинное обучение"
  branch: main

